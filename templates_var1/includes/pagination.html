{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if active_skill %}&skill={{ active_skill }}{% endif %}{% if active_filter %}&filter={{ active_filter }}{% endif %}" class="black-button">Назад</a>
    {% endif %}
    <span class="page-info">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if active_skill %}&skill={{ active_skill }}{% endif %}{% if active_filter %}&filter={{ active_filter }}{% endif %}" class="black-button">Вперёд</a>
    {% endif %}
</div>
{% endif %}
